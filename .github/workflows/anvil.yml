name: anvil
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            asset: anvil-linux-x86_64
            binary: build/anvil
            os: ubuntu-24.04
            flags: "-DGGML_NATIVE=OFF -DGGML_VULKAN=ON -DGGML_CUDA=OFF -DGGML_HIP=OFF -DGGML_SYCL=OFF -DGGML_OPENVINO=OFF -DGGML_OPENCL=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON"
          - name: linux-aarch64
            asset: anvil-linux-aarch64
            binary: build/anvil
            os: ubuntu-24.04-arm
            flags: "-DGGML_NATIVE=OFF -DGGML_VULKAN=ON -DGGML_CUDA=OFF -DGGML_HIP=OFF -DGGML_SYCL=OFF -DGGML_OPENVINO=OFF -DGGML_OPENCL=OFF"
          - name: macos-aarch64
            asset: anvil-macos-aarch64
            binary: build/anvil
            os: macos-latest
            flags: "-DGGML_NATIVE=OFF -DGGML_CUDA=OFF -DGGML_HIP=OFF -DGGML_SYCL=OFF -DGGML_OPENVINO=OFF -DGGML_OPENCL=OFF"
          - name: windows-x86_64
            asset: anvil-windows-x86_64.exe
            binary: build/Release/anvil.exe
            os: windows-latest
            flags: "-DGGML_NATIVE=OFF -DGGML_VULKAN=ON -DGGML_CUDA=OFF -DGGML_HIP=OFF -DGGML_SYCL=OFF -DGGML_OPENVINO=OFF -DGGML_OPENCL=OFF -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake g++ git libvulkan-dev glslc glslang-tools glslang-dev spirv-headers spirv-tools
      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Pinned release, NOT the 'latest' pointer: LunarG rotates the blob
          # behind 'latest' and served an expired Azure blob (BlobNotFound),
          # which hung this step for ~30 minutes on every prior run. A pinned
          # version + hard timeouts fail fast instead of hanging.
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $version = '1.3.290.0'
          $installer = "$env:TEMP\vulkan-sdk-$version.exe"
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$version/windows/VulkanSDK-$version-Installer.exe" `
            -OutFile $installer -TimeoutSec 600
          $p = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -NoNewWindow -PassThru -TimeoutSec 900
          if ($p.ExitCode -ne 0) { throw "Vulkan SDK installer failed with exit code $($p.ExitCode)" }
          # Installer layout is C:\VulkanSDK\<version>; point VULKAN_SDK at the
          # versioned dir — ggml's find_package(Vulkan) uses it as a prefix path.
          $sdkRoot = Get-ChildItem 'C:\VulkanSDK' -Directory -ErrorAction SilentlyContinue |
                     Where-Object { $_.Name -eq $version } | Select-Object -First 1
          if (-not $sdkRoot) { throw "Vulkan SDK $version not found under C:\VulkanSDK after install" }
          "VULKAN_SDK=$($sdkRoot.FullName)" >> $env:GITHUB_ENV
      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release ${{ matrix.flags }}
      - name: Build
        run: cmake --build build --config Release
      - name: Check Vulkan linkage (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "=== Vulkan dependency check ==="
          ldd build/anvil | grep -i vulkan && echo "⚠ hard libvulkan dependency detected" || echo "✅ no hard dependency — dlopen fallback active"
      - name: Smoke test
        shell: bash
        run: bash tests/smoke.sh "${{ matrix.binary }}"
      - name: Strip Unix binary
        if: runner.os != 'Windows'
        run: strip build/anvil || true
      - name: Rename Unix release asset
        if: runner.os != 'Windows'
        run: cp "${{ matrix.binary }}" "${{ matrix.asset }}"
      - name: Rename Windows release asset
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item "${{ matrix.binary }}" "${{ matrix.asset }}"
      - name: Upload artifact (all builds)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
