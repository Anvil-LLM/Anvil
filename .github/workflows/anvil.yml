name: anvil
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            asset: anvil-linux-x86_64
            binary: build/anvil
            os: ubuntu-24.04
            flags: "-DGGML_NATIVE=OFF -DGGML_VULKAN=ON -DGGML_CUDA=OFF -DGGML_HIP=OFF -DGGML_SYCL=OFF -DGGML_OPENVINO=OFF -DGGML_OPENCL=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON"
          - name: linux-aarch64
            asset: anvil-linux-aarch64
            binary: build/anvil
            os: ubuntu-24.04-arm
            flags: "-DGGML_NATIVE=OFF -DGGML_VULKAN=ON -DGGML_CUDA=OFF -DGGML_HIP=OFF -DGGML_SYCL=OFF -DGGML_OPENVINO=OFF -DGGML_OPENCL=OFF"
          - name: macos-aarch64
            asset: anvil-macos-aarch64
            binary: build/anvil
            os: macos-latest
            flags: "-DGGML_NATIVE=OFF -DGGML_CUDA=OFF -DGGML_HIP=OFF -DGGML_SYCL=OFF -DGGML_OPENVINO=OFF -DGGML_OPENCL=OFF"
          - name: windows-x86_64
            asset: anvil-windows-x86_64.exe
            binary: build/Release/anvil.exe
            os: windows-latest
            flags: "-DGGML_NATIVE=OFF -DGGML_VULKAN=ON -DGGML_OPENMP=ON -DGGML_CUDA=OFF -DGGML_HIP=OFF -DGGML_SYCL=OFF -DGGML_OPENVINO=OFF -DGGML_OPENCL=OFF"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ git libvulkan-dev glslc glslang-tools glslang-dev spirv-headers spirv-tools
      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release ${{ matrix.flags }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Check Vulkan linkage (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "=== Vulkan dependency check ==="
          if ldd build/anvil | grep -i vulkan; then echo "⚠ hard libvulkan dependency detected"; else echo "✅ no hard dependency — dlopen fallback active"; fi
      - name: Smoke test
        shell: bash
        run: bash tests/smoke.sh "${{ matrix.binary }}"
      - name: Strip Unix binary
        if: runner.os != 'Windows'
        run: strip build/anvil || true
      - name: Rename Unix release asset
        if: runner.os != 'Windows'
        run: cp "${{ matrix.binary }}" "${{ matrix.asset }}"
      - name: Rename Windows release asset
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item "${{ matrix.binary }}" "${{ matrix.asset }}"
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
