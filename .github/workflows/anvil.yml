name: anvil

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            flags: "-DGGML_NATIVE=OFF -DGGML_VULKAN=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON"
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            flags: "-DGGML_NATIVE=OFF -DGGML_VULKAN=ON"
          - name: macos-aarch64
            os: macos-latest
            flags: "-DGGML_NATIVE=OFF"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ git \
            libvulkan-dev glslc glslang-tools glslang-dev \
            spirv-headers spirv-tools
      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release ${{ matrix.flags }}

      - name: Build
        run: cmake --build build --config Release -j"$(nproc 2>/dev/null || sysctl -n hw.ncpu)"

      - name: Check Vulkan linkage (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "=== Vulkan dependency check ==="
          if ldd build/anvil | grep -i vulkan; then
            echo "⚠ hard libvulkan dependency detected"
          else
            echo "✅ no hard dependency — dlopen fallback active"
          fi

      - name: Strip binary
        run: strip build/anvil || true

      - name: Rename to release asset
        run: cp build/anvil anvil-${{ matrix.name }}

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: anvil-${{ matrix.name }}
